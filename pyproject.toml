[build-system]
requires = [
    "scikit-build-core>=0.10",
    "setuptools-scm>=8",
    # Ecosystem packages this build resolves from installed wheels rather
    # than fetching from git master, so the wheel links against exactly the
    # binaries users get at runtime and ships only its own files. Mirror
    # [project].dependencies; leave the floors unbounded so the newest
    # release is always resolved.
    "nwchemex-nwxcmake>=0.1.0",
    "nwchemex-simde>=0.0.77",
]
build-backend = "scikit_build_core.build"

[project]
name = "nwchemex-nux"
dynamic = ["version"]
description = "NWChemEx User eXperience (NUX) driver layer for the NWChemEx ecosystem"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = [
    # Must match NWXCMake cmake/dependencies/pybind11.cmake GIT_TAG: a
    # different PYBIND11_INTERNALS_VERSION gives extensions separate type
    # registries and breaks cross-module type exchange.
    "pybind11==3.1.0",
    "nwchemex-nwxcmake>=0.1.0",
    "nwchemex-simde>=0.0.77",
]

[project.optional-dependencies]
dev = ["pytest", "pre-commit"]

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
# All installed content comes from the CMake install; no pure-Python packages.
wheel.packages = []
# Ship only this project's own install rules ("nux") plus third-party
# dependencies this build had to fetch itself ("Unspecified", CMake's default
# component). Ecosystem dependencies are resolved from their own wheels, and
# their files belong to those wheels.
install.components = ["nux", "Unspecified"]
build-dir = "build"

[tool.setuptools_scm]
fallback_version = "0.0.0"

# tests/python/unit_tests/test_nux/ and .../integration_tests/test_nux/ share
# the same basename with no unique package root above them, so pytest's
# default (prepend) import mode collides on the dotted module name
# "test_nux.test_plugin" for both. importlib mode identifies modules by
# file path instead, sidestepping the collision without renaming anything.
[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

# For editable (developer) installs, also build the tests.
[[tool.scikit-build.overrides]]
if.state = "editable"
cmake.args = ["-DDEVELOPER_SETUP=ON"]
